{% extends "base.html" %}
{% block title %}Вход - АИС Забота{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl overflow-hidden mt-10 md:mt-16">
    <div class="bg-brand text-white p-6 text-center relative overflow-hidden">
        <!-- Декоративный круг -->
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-white opacity-10 rounded-full"></div>
        <i class="fa-solid fa-shield-halved text-4xl mb-2"></i>
        <h2 class="text-2xl font-bold">С возвращением</h2>
        <p class="text-blue-200 text-sm mt-1">Войдите в систему для продолжения работы</p>
    </div>

    <div class="p-8">
        <script>
            const urlParams = new URLSearchParams(window.location.search);
            if(urlParams.get('registered') === '1') {
                document.write('<div class="bg-emerald-50 text-success border border-success p-3 rounded-lg mb-6 text-sm font-bold text-center flex items-center justify-center gap-2"><i class="fa-solid fa-check-circle text-lg"></i> Регистрация успешна! Теперь войдите.</div>');
            }
        </script>

        {% if error %}
        <div class="bg-red-50 text-danger border border-red-200 p-3 rounded-lg mb-6 text-sm font-bold text-center flex items-center justify-center gap-2">
            <i class="fa-solid fa-triangle-exclamation text-lg"></i> {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="POST" class="space-y-5">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Номер телефона</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fa-solid fa-phone text-gray-400"></i>
                    </div>
                    <input type="tel" name="phone" required placeholder="+7 (999) 000-00-00" class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-brand outline-none transition shadow-sm">
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Пароль</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fa-solid fa-lock text-gray-400"></i>
                    </div>
                    <input type="password" name="password" required placeholder="••••••••" class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-brand outline-none transition shadow-sm">
                </div>
            </div>

            <button type="submit" class="w-full bg-brand text-white font-bold text-lg py-3 rounded-xl shadow-lg hover:shadow-brand/50 hover:-translate-y-0.5 transition-all duration-200 mt-2">
                Войти в аккаунт
            </button>
        </form>

        <div class="mt-8 text-center text-sm text-gray-500 border-t pt-6">
            Еще не зарегистрированы? <br>
            <a href="/register" class="inline-block mt-2 text-brand font-bold hover:underline">Создать новый аккаунт</a>
        </div>
    </div>
</div>
{% endblock %}
